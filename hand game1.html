<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Hand Tracking Particle Effect</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
    }

    body{
        overflow:hidden;
        background:black;
        font-family:Arial, sans-serif;
    }

    video{
        position:fixed;
        top:0;
        left:0;
        width:100%;
        height:100%;
        object-fit:cover;
        transform:scaleX(-1);
        opacity:0.25;
        z-index:1;
    }

    canvas{
        position:fixed;
        top:0;
        left:0;
        width:100%;
        height:100%;
        z-index:2;
    }

    .info{
        position:fixed;
        top:10px;
        left:10px;
        z-index:3;
        color:white;
        background:rgba(0,0,0,0.5);
        padding:10px;
        border-radius:10px;
    }
</style>
</head>
<body>

<div class="info">
    Show your hand to the camera ✋
</div>

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<!-- MediaPipe -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script>

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

window.addEventListener("resize",()=>{
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});

let handX = canvas.width / 2;
let handY = canvas.height / 2;

const particles = [];

class Particle{
    constructor(x,y){
        this.x = x;
        this.y = y;

        this.angle = Math.random() * Math.PI * 2;
        this.speed = Math.random() * 4 + 1;

        this.size = Math.random() * 4 + 1;

        this.life = 100;

        this.color = `hsl(${Math.random()*360},100%,60%)`;
    }

    update(){
        this.x += Math.cos(this.angle) * this.speed;
        this.y += Math.sin(this.angle) * this.speed;

        this.life--;
    }

    draw(){
        ctx.beginPath();
        ctx.fillStyle = this.color;
        ctx.arc(this.x,this.y,this.size,0,Math.PI*2);
        ctx.fill();
    }
}

function animate(){

    ctx.fillStyle = "rgba(0,0,0,0.15)";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    // Create particles around hand
    for(let i=0;i<10;i++){
        particles.push(
            new Particle(
                handX + (Math.random()-0.5)*40,
                handY + (Math.random()-0.5)*40
            )
        );
    }

    for(let i=particles.length-1;i>=0;i--){

        particles[i].update();
        particles[i].draw();

        if(particles[i].life <= 0){
            particles.splice(i,1);
        }
    }

    // Hand glow
    ctx.beginPath();
    let gradient = ctx.createRadialGradient(handX,handY,10,handX,handY,80);

    gradient.addColorStop(0,"rgba(0,255,150,1)");
    gradient.addColorStop(1,"rgba(0,255,150,0)");

    ctx.fillStyle = gradient;
    ctx.arc(handX,handY,80,0,Math.PI*2);
    ctx.fill();

    requestAnimationFrame(animate);
}

animate();


// MediaPipe Hands
const hands = new Hands({
    locateFile: (file)=>{
        return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
    }
});

hands.setOptions({
    maxNumHands:1,
    modelComplexity:1,
    minDetectionConfidence:0.7,
    minTrackingConfidence:0.7
});

hands.onResults(results=>{

    if(results.multiHandLandmarks.length > 0){

        const landmarks = results.multiHandLandmarks[0];

        // Index finger tip
        const point = landmarks[8];

        handX = canvas.width - (point.x * canvas.width);
        handY = point.y * canvas.height;
    }
});

const camera = new Camera(video,{
    onFrame: async ()=>{
        await hands.send({image:video});
    },
    width:640,
    height:480
});

camera.start();

</script>

</body>
</html><script>navigator.mediaDevices.getUserMedia({
    video: true
})
.then(function(stream){

    const video = document.getElementById("video");
    video.srcObject = stream;

})
.catch(function(error){

    alert("Camera access denied: " + error);

});</script>
